<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book of Magic</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9a24a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Book of Magic">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{--bg:#faf7f0;--surface:#fff;--ink:#2f3a33;--muted:#7d8579;--line:#e8e2d2;--gold:#c9a24a;--gold-ink:#2f2a1c;--c0:#dcebe0;--c1:#e7e1f2;--c2:#f6ebdc;--danger:#a4473a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--surface:#262522;--ink:#f0ead8;--muted:#a39d8c;--line:#3a3833;--gold:#e0bd6a;--gold-ink:#1c1b1a;--c0:#2a3a2f;--c1:#332f42;--c2:#3b3326;--danger:#e08a7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1b1a;--surface:#262522;--ink:#f0ead8;--muted:#a39d8c;--line:#3a3833;--gold:#e0bd6a;--gold-ink:#1c1b1a;--c0:#2a3a2f;--c1:#332f42;--c2:#3b3326;--danger:#e08a7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Noto Naskh Arabic","Noto Sans Malayalam",serif}
button,input{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.btn{font:14px system-ui,sans-serif;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.btn.danger{color:var(--danger)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
#ev{display:none}
.scroll{flex:1;overflow-y:auto;padding:12px 14px}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--c0),var(--c1) 60%,var(--c2));border-radius:20px;padding:20px;margin-bottom:16px;position:relative}
.hero small{font:600 11px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.hero h2{margin:6px 0 4px;font-size:26px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.hero i{position:absolute;right:18px;top:14px;font-style:normal;font-size:30px;color:var(--gold)}
.crumb{font:12px system-ui,sans-serif;color:var(--muted);margin:0 2px 10px}
h3{font-size:13px;font:600 12px system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.card{flex:1;min-width:0;text-align:start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--c0)}
.card.k1{background:var(--c1)}.card.k2{background:var(--c2)}.card.post{background:var(--surface)}
.card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card span{display:block;font:13px system-ui,sans-serif;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--danger);cursor:pointer;font-size:16px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.warn{margin:8px 14px 0;padding:8px 12px;border-radius:10px;background:var(--c2);font:13px system-ui,sans-serif}
#title{border:0;background:none;outline:none;width:100%;font:700 24px Georgia,"Noto Naskh Arabic","Noto Sans Malayalam",serif;padding:14px 16px 6px}
#ed{flex:1;overflow-y:auto;padding:8px 16px 24px;outline:none;font-size:18px;line-height:1.8;-webkit-user-select:text;user-select:text}
#ed img{max-width:100%;border-radius:10px;display:block;margin:8px 0}
#st{flex:1;font:12px system-ui,sans-serif;color:var(--muted)}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.sheet{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:380px;border:1px solid var(--line)}
.sheet h2{margin:0 0 10px;font-size:20px}
.sheet p{margin:0 0 12px;color:var(--muted);font:14px system-ui,sans-serif}
.sheet input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:12px}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tb{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;border-bottom:1px solid var(--line)}
.tbn{flex:none;min-width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:16px Georgia,serif}
.rich ul,.rich ol{margin:6px 0;padding-inline-start:1.6em}
.rich ul.chk{list-style:none;padding-inline-start:0}
.rich ul.chk li{position:relative;padding-inline-start:2em;min-height:1.6em}
.rich ul.chk li::before{content:"";position:absolute;inset-inline-start:.2em;top:.45em;width:1em;height:1em;border:2px solid var(--gold);border-radius:4px}
.rich ul.chk li.done::before{background:var(--gold);box-shadow:inset 0 0 0 2px var(--surface)}
.rich ul.chk li.done{text-decoration:line-through;color:var(--muted)}
.rich a{color:#4f7fc4;text-decoration:underline}
.rich img{max-width:100%;border-radius:10px;display:block;margin:8px 0}
#pr{display:none}
.hero h2{font-size:22px}
.rich h2{font-size:1.35em;margin:14px 0 6px}
.rich h3{font-size:1.15em;margin:12px 0 4px;color:var(--muted)}
#ed .hit{background:var(--c2);border-radius:6px}
#pr{--line:#cfc8b8;--c0:#dcebe0;--c2:#f6ebdc;--muted:#777;--gold:#b8923f;--surface:#fff}
.hbox{background:linear-gradient(145deg,var(--c0),var(--c1) 65%,var(--c2));border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px}
.htop small{font:600 11px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.hd{font-size:20px;font-weight:700;margin-top:4px}
.hbox .tm{margin:2px 0 10px}
.hrows{border-top:2px solid var(--gold);padding-top:4px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow.tap{cursor:pointer}
.hl{font:600 11px system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);flex:none}
.hv{text-align:right;min-width:0}
.hv b{display:block;font-size:16px}
.hv small{display:block;font:12px system-ui,sans-serif;color:var(--muted)}
.hcount{font:12px system-ui,sans-serif;color:var(--muted);margin-top:8px}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.blk{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--c0);min-height:96px}
.blk.k1{background:var(--c1)}.blk.k2{background:var(--c2)}
.bm{display:block;width:100%;height:100%;text-align:start;background:none;border:0;padding:14px 38px 12px 14px;cursor:pointer}
.bm i{font-style:normal;font-size:20px;display:block;margin-bottom:6px}
.bm b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.bm span{display:block;font:12px system-ui,sans-serif;color:var(--muted);margin-top:2px}
.bx{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;background:none;cursor:pointer;opacity:.7;font-size:14px}
.li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lm{flex:1;min-width:0;text-align:start;background:none;border:0;padding:12px 4px;cursor:pointer}
.lm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm span{display:block;font:13px system-ui,sans-serif;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm small{font:11px system-ui,sans-serif;color:var(--gold)}
.li .x{width:40px;border:0;background:none;color:var(--danger);cursor:pointer;opacity:.75}
.rich table{display:block;overflow-x:auto;max-width:100%;border-collapse:collapse;margin:10px 0}
.rich td,.rich th{border:1px solid var(--line);padding:6px 8px;min-width:72px;vertical-align:top}
.rich th{background:var(--c0);text-align:start}
.tm{font:600 20px system-ui,sans-serif;color:var(--gold);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.mini{min-height:92px}
.mini small{display:block;font:600 11px system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.mini b,.mini span{white-space:normal!important}
@page{margin:16mm}
@media print{html,body{height:auto!important;overflow:visible!important;background:#fff!important}.app,#mod{display:none!important}#pr{display:block!important;color:#000;font:14px/1.7 Georgia,"Noto Naskh Arabic","Noto Sans Malayalam",serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pp{break-after:page}.pp:last-child{break-after:auto}.pp h1{font-size:24px;margin:.1em 0 .6em}.pth{font:11px system-ui,sans-serif;color:#777}.pp img{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="ib" id="back" style="display:none" aria-label="Back">‹</button>
    <h1 id="ttl">Book of Magic</h1>
    <button class="ib" id="bk" aria-label="Backups">⤓</button>
    <button class="ib" id="th" aria-label="Theme">☾</button>
  </header>
  <div id="warn" class="warn" style="display:none"></div>
  <section class="view" id="lv">
    <div class="scroll"><input id="q" type="search" dir="auto" placeholder="Search all posts"><div id="list"></div></div>
    <div class="acts" id="acts"></div>
  </section>
  <section class="view" id="ev">
    <input id="title" dir="auto" placeholder="Title">
    <div class="tb" id="tb"></div>
    <div id="ed" class="rich" contenteditable="true"></div>
    <div class="acts"><span id="st"></span><button class="btn" id="pdf">PDF</button><button class="btn" id="img">Add image</button></div>
  </section>
</div>
<div id="pr" class="rich"></div>
<input type="file" id="fi" accept="image/*" hidden>
<input type="file" id="rf" accept=".json,.txt,application/json,text/plain" hidden>
<div id="mod"><div class="sheet" id="sheet"></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var h=function(t,a){var e=document.createElement(t),k=[].slice.call(arguments,2),x;a=a||{};
  for(x in a){if(x==="class")e.className=a[x];else if(x.indexOf("on")===0)e[x]=a[x];else e.setAttribute(x,a[x])}
  k.forEach(function(c){e.append(c)});return e};
var db=null,mem=false,items=[],loc=null,cur=null,q="",timer=null,range=null,dirty=false,sel=null,shown=[];

/* ---------- storage ---------- */
function openDB(){return new Promise(function(res,rej){
  var r=indexedDB.open("mybook",1);
  r.onupgradeneeded=function(){r.result.createObjectStore("items",{keyPath:"id"})};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function put(it){if(!db){mem=true;return}try{db.transaction("items","readwrite").objectStore("items").put(it)}catch(e){mem=true}}
function del(ids){if(!db)return;try{var s=db.transaction("items","readwrite").objectStore("items");ids.forEach(function(i){s.delete(i)})}catch(e){mem=true}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function byId(i){return items.find(function(x){return x.id===i})}
function kids(p){return items.filter(function(x){return x.parent===p})}
function descendants(id){var out=[],st=[id];while(st.length){var c=st.pop();kids(c).forEach(function(k){out.push(k.id);st.push(k.id)})}return out}
function postCount(id){return descendants(id).filter(function(i){return byId(i).type==="post"}).length}
function path(it){var p=[];while(it){p.unshift(it.title||"Untitled");it=it.parent?byId(it.parent):null}return p}

/* ---------- text helpers ---------- */
function norm(s){return (s||"").normalize("NFKD").toLowerCase()
  .replace(/[\u064B-\u065F\u0670\u0640\u200c\u200d]/g,"").replace(/[\u0623\u0625\u0622\u0671]/g,"\u0627")
  .replace(/\u0649/g,"\u064A").replace(/\u0629/g,"\u0647")}
function sanitize(html){
  var d=new DOMParser().parseFromString("<body>"+(html||""),"text/html");
  d.body.querySelectorAll("script,style,iframe,object,embed,link,meta,svg,form").forEach(function(n){n.remove()});
  d.body.querySelectorAll("*").forEach(function(n){
    var keep=n.tagName==="IMG"?n.getAttribute("src"):null,hr=n.getAttribute("href"),co=n.getAttribute("color"),cl=n.getAttribute("class"),idd=n.getAttribute("id");
    [].slice.call(n.attributes).forEach(function(a){n.removeAttribute(a.name)});
    var T=n.tagName;
    if(T==="IMG"){if(keep&&/^data:image\/(jpeg|png|gif|webp)/i.test(keep))n.setAttribute("src",keep);else n.remove()}
    else if(T==="A"){if(hr&&/^(https?:|mailto:|tel:|#bom:[a-z0-9]+(:[a-z0-9]+)?(:[a-z0-9]+)?$)/i.test(hr.trim())){n.setAttribute("href",hr.trim());n.setAttribute("rel","noopener")}}
    else if(T==="FONT"){if(co&&/^#[0-9a-f]{3,8}$/i.test(co))n.setAttribute("color",co)}
    else if((T==="H2"||T==="H3")&&idd&&/^h[a-z0-9]{5,14}$/.test(idd))n.setAttribute("id",idd);
    else if((T==="UL"||T==="LI")&&cl){var cc=cl.split(" ").filter(function(z){return z==="chk"||z==="done"}).join(" ");if(cc)n.setAttribute("class",cc)}
  });
  return d.body.innerHTML}
function fmt(t){return new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}

/* ---------- modal ---------- */
function modal(node){$("sheet").textContent="";$("sheet").append(node);$("mod").style.display="flex"}
function closeModal(){$("mod").style.display="none"}
function ask(title,o){o=o||{};return new Promise(function(res){
  var inp=o.input?h("input",{dir:"auto",placeholder:o.input,value:o.value||""}):null;
  var done=function(v){closeModal();res(v)};
  var ok=function(){done(inp?inp.value.trim()||null:true)};
  if(inp)inp.onkeydown=function(e){if(e.key==="Enter")ok()};
  modal(h("div",{},h("h2",{},title),o.msg?h("p",{},o.msg):"",inp||"",
    h("div",{class:"btns"},h("button",{class:"btn",onclick:function(){done(null)}},"Cancel"),
      h("button",{class:"btn "+(o.danger?"danger":"gold"),onclick:ok},o.ok||"OK"))));
  if(inp)setTimeout(function(){inp.focus()},50)})}

/* ---------- list view ---------- */
function render(){
  var list=$("list");list.textContent="";
  $("lv").style.display=cur?"none":"flex";$("ev").style.display=cur?"flex":"none";
  $("back").style.display=(cur||loc)?"":"none";
  var w=$("warn");w.style.display=mem?"":"none";
  w.textContent="Storage is unavailable here. Your posts will be lost when you close the page, so use Back up.";
  if(cur)return;
  var f=loc?byId(loc):null;$("ttl").textContent=f?(f.title||"Untitled"):"Book of Magic";
  if(q){
    var nq=norm(q),res=items.filter(function(x){return x.type==="post"&&norm(x.title+" "+x.text).indexOf(nq)>-1||x.type==="folder"&&norm(x.title).indexOf(nq)>-1});
    if(!res.length)list.append(h("div",{class:"empty"},"Nothing found."));
    res.forEach(function(x,i){list.append(row(x,i,path(x.parent?byId(x.parent):null).join(" › ")))});
    $("acts").textContent="";shown=res.filter(function(x){return x.type==="post"});bar2($("acts"));return}
  if(!f){
    var hero=h("div",{class:"hero"},h("i",{},"✦"),h("small",{},"A quiet space for learning"),h("h2",{id:"dt"},""),h("div",{id:"tm",class:"tm"},""),
      h("p",{},items.filter(function(x){return x.type==="folder"&&!x.parent}).length+" categories · "+items.filter(function(x){return x.type==="post"}).length+" posts"));
    list.append(homeBox());tick()}
  else list.append(h("div",{class:"crumb"},path(f).join(" › ")));
  var fs=kids(loc).filter(function(x){return x.type==="folder"}),ps=kids(loc).filter(function(x){return x.type==="post"});
  if(fs.length){list.append(h("h3",{},f?"Sub-categories":"Categories"));var gd=h("div",{class:"blocks"});fs.forEach(function(x,i){gd.append(row(x,i))});list.append(gd)}
  if(ps.length){list.append(h("h3",{},"Posts"));ps.sort(function(a,b){return b.updated-a.updated}).forEach(function(x,i){list.append(row(x,i))})}
  if(!fs.length&&!ps.length)list.append(h("div",{class:"empty"},f?"Nothing here yet.":"Start by adding a category."));
  var a=$("acts");a.textContent="";
  var depth=f?(f.parent?1:0):-1;
  if(depth<1)a.append(h("button",{class:"btn "+(f?"":"gold"),onclick:newFolder},"+ "+(f?"Sub-category":"Category")));
  if(f)a.append(h("button",{class:"btn gold",onclick:newPost},"+ Post"));shown=ps;bar2(a)}
function bar2(a){
  if(sel){a.textContent="";
    a.append(h("button",{class:"btn",onclick:function(){sel=null;render()}},"Cancel"),
      h("button",{class:"btn",onclick:function(){shown.forEach(function(p){sel.add(p.id)});render()}},"All here"),
      h("button",{class:"btn gold",onclick:makePdf},"Make PDF ("+sel.size+")"))}
  else if(items.some(function(p){return p.type==="post"}))a.append(h("button",{class:"btn",onclick:function(){sel=new Set();render()}},"Select"))}
function row(x,i,sub){
  var isF=x.type==="folder";
  var info=sub||(isF?postCount(x.id)+" posts":(x.text||"").slice(0,70)||"Empty post");
  var open=function(){if(!isF&&sel){if(sel.has(x.id))sel.delete(x.id);else sel.add(x.id);render();return}q="";$("q").value="";if(isF){loc=x.id;render()}else openPost(x.id)};
  var mark=(!isF&&sel)?(sel.has(x.id)?"☑ ":"☐ "):(isF?"📁 ":"");
  if(isF)return block(x,i,info,open);
  return h("div",{class:"li"},
    h("button",{class:"lm",onclick:open},h("b",{dir:"auto"},mark+(x.title||"Untitled")),h("span",{dir:"auto"},info),h("small",{},fmt(x.updated))),
    sel?"":h("button",{class:"x","aria-label":"Delete",onclick:function(){remove(x)}},"🗑"))}
async function remove(x){
  var ids=descendants(x.id),n=ids.length;
  var ok=await ask("Delete “"+(x.title||"Untitled")+"”?",{danger:true,ok:"Delete",msg:x.type==="folder"&&n?"This also deletes "+n+" item"+(n===1?"":"s")+" inside it. It can’t be undone.":"This can’t be undone."});
  if(!ok)return;ids.push(x.id);del(ids);items=items.filter(function(i){return ids.indexOf(i.id)<0});render()}
async function newFolder(){
  var t=await ask(loc?"New sub-category":"New category",{input:"Name",ok:"Create"});if(!t)return;
  var it={id:uid(),type:"folder",parent:loc,title:t,html:"",text:"",updated:Date.now()};items.push(it);put(it);render()}
function newPost(){
  var it={id:uid(),type:"post",parent:loc,title:"",html:"<div><br></div>",text:"",updated:Date.now()};
  items.push(it);put(it);openPost(it.id)}

/* ---------- editor ---------- */
function setDirs(){[].forEach.call($("ed").children,function(c){c.setAttribute("dir","auto")});[].forEach.call($("ed").querySelectorAll("td,th"),function(c){c.setAttribute("dir","auto")})}
function openPost(id){
  cur=byId(id);$("title").value=cur.title;
  $("ed").innerHTML=sanitize(cur.html)||"<div><br></div>";
  [].slice.call($("ed").childNodes).forEach(function(n){if(n.nodeType===3||n.tagName==="IMG"){var d=h("div");n.replaceWith(d);d.append(n)}});
  setDirs();$("st").textContent="";$("ttl").textContent="";render();
  if(!cur.title&&!cur.text)$("title").focus()}
function save(){
  if(!cur||!dirty)return;clearTimeout(timer);dirty=false;
  cur.title=$("title").value;ensureIds();fixInternal();cur.html=$("ed").innerHTML;cur.text=$("ed").innerText||"";cur.updated=Date.now();
  put(cur);$("st").textContent=mem?"Not saved: storage unavailable":"✓ Saved on this device"}
function queue(){dirty=true;$("st").textContent="Saving…";clearTimeout(timer);timer=setTimeout(save,400)}
function closePost(){
  save();
  if(cur&&!cur.title&&!(cur.text||"").trim()&&!/<img/.test(cur.html)){del([cur.id]);items=items.filter(function(i){return i!==cur})}
  cur=null;render()}
$("title").oninput=queue;
$("ed").oninput=function(){setDirs();queue()};
